[package]
name = "wub-machine-wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "window",
    "document",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferOptions",
] }
js-sys = "0.3"
ndarray = "0.15"
ndarray-stats = "0.5"
rustfft = "6.0"
num-complex = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = "z"
lto = true

[dev-dependencies]
wasm-bindgen-test = "1"
